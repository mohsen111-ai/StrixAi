[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "strixai"
version = "0.1.0"
description = "Strix: an autonomous terminal coding agent for open and budget models (Qwen, Kimi, DeepSeek, Gemini)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["textual>=0.80", "rich>=13", "httpx>=0.27", "pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]

[project.scripts]
strix = "strix.cli:main"

[tool.setuptools]
packages = ["strix"]

[tool.setuptools.package-data]
strix = ["*.yaml", "*.tcss", "*.html"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
